name: download-check

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Download the same files from a clean runner
        run: |
          docker pull ghcr.io/databricks/cli:v0.296.1
          docker run --rm --entrypoint sh ghcr.io/databricks/cli:v0.296.1 -c \
            'databricks --version; env | grep -i "^DATABRICKS_TF" || true; ls -R /app 2>/dev/null | head -20 || true'
